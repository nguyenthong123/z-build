name: Daily SEO Update

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  update-seo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate SEO files
        run: node scripts/generate-seo-files.cjs
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "SEO Bot"
          git config user.email "bot@zbuild.click"
          git add public/sitemap.xml public/products.json
          if git diff --cached --quiet; then
            echo "No changes to SEO files"
          else
            git commit -m "chore: auto-update sitemap & products feed"
            git push
          fi
